[phases.setup]
nixPkgs = ["php84", "php84Packages.composer"]

[phases.build]
cmds = [
    "cd backend && composer install --no-interaction --optimize-autoloader --no-dev",
    "cd backend && php artisan storage:link --force"
]

[start]
cmd = "cd backend && php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
